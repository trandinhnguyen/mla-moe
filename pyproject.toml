[project]
name = "mla-moe-tooling"
version = "0.1.0"
description = "Python oracle + weight-loading test tooling for the MLA-MoE C inference engine."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.24",
    "safetensors>=0.4.0",
    "transformers>=5.0",
    "accelerate>=1.0",
    "torch>=2.12",
]

# The eval's METEOR/BERTScore accuracy tier. `make getp-eval` always uses it (pass
# QUICK=1 to skip it and get diagnostics only); `make eval` uses it under FUZZY=1.
# Kept out of the default install: it pulls datasets + a roberta-large download,
# and the teacher-forced top-1/perplexity path needs none of it.
[project.optional-dependencies]
fuzzy = [
    "evaluate>=0.4",
    "bert-score>=0.3.13",
    "nltk>=3.8",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
